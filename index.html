<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="KING AI PRO - Created & Owned by Abdullah Waheed.">
  <title>King AI PRO — Owned by Abdullah Waheed</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            king: { gold: '#fbbf24', navy: '#070b14', slate: '#0d1527', card: '#131e36', border: '#223254' }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@700;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-royal { font-family: 'Cinzel', serif; }
    .gold-gradient-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fffbeb 0%, #fbbf24 40%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .chat-bubble-ai { background: #111b33; border: 1px solid #223254; }
    .chat-bubble-user { background: #223254; border: 1px solid #3b507d; }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(err => console.log('SW:', err));
      });
    }
  </script>
</head>
<body class="bg-king-navy text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 bg-king-slate border-b border-king-border sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('chat')">
        <div class="w-8 h-8 rounded-lg gold-gradient-bg flex items-center justify-center text-slate-950 font-black">👑</div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-royal font-black text-base gold-gradient-text">KING AI</span>
            <span class="bg-emerald-500 text-slate-950 text-[10px] font-black px-1.5 py-0.5 rounded">VIP PRO</span>
          </div>
          <p class="text-[10px] text-amber-300">Owned by <strong class="text-amber-200">Abdullah Waheed</strong></p>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openVipModal()" id="topVipBtn" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs">
        🎟️ <span id="topVipText">VIP Pass</span>
      </button>
      <button onclick="createNewChat()" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs">
        + New Chat
      </button>
      <button onclick="switchTab('settings')" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <div class="flex flex-1 h-[calc(100vh-57px)] overflow-hidden">

    <!-- Sidebar with Chat Sessions History -->
    <aside class="w-64 bg-king-slate border-r border-king-border flex flex-col p-3 space-y-3 overflow-y-auto">
      
      <!-- User Info -->
      <div class="p-3 rounded-xl bg-slate-900 border border-king-border flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg gold-gradient-bg flex items-center justify-center text-slate-950 font-bold">👑</div>
        <div class="overflow-hidden">
          <h3 class="font-bold text-xs text-white truncate">Abdullah Waheed</h3>
          <p class="text-[10px] text-amber-300">Official App Owner & Creator</p>
        </div>
      </div>

      <!-- VIP Button -->
      <button onclick="openVipModal()" class="w-full p-2.5 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs text-left">
        <div>🎟️ VIP Pass Unlock</div>
        <div class="text-[9px] text-slate-900 font-semibold">Unlimited Fast Chat</div>
      </button>

      <!-- Chat History Drawer -->
      <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase pt-2">
        <span>Recent Chats</span>
        <button onclick="clearAllHistory()" class="text-red-400 hover:underline">Clear All</button>
      </div>
      <div id="chatHistoryList" class="space-y-1 max-h-48 overflow-y-auto">
        <!-- Rendered dynamically -->
      </div>

      <!-- Usage Limits -->
      <div class="p-2.5 rounded-xl bg-slate-900 border border-king-border text-[10px] space-y-1 mt-auto">
        <div class="flex justify-between text-slate-400 font-bold">
          <span id="tierLabel">FREE PLAN LIMIT</span>
          <span class="text-amber-400">24H RESET</span>
        </div>
        <div class="flex justify-between"><span>💬 Messages:</span><span id="msgCount" class="font-bold text-amber-300">0 / 50</span></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-king-navy relative">
      
      <!-- TAB: CHAT -->
      <section id="tab-chat" class="flex-1 flex flex-col h-full">
        <!-- Top Info Bar -->
        <div class="px-4 py-2 border-b border-king-border bg-king-slate flex justify-between items-center text-xs">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="font-bold">Fast Engine: gemini-3.6-flash</span>
          </div>
        </div>

        <!-- Chat Display -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
          <div id="welcomeScreen" class="max-w-xl mx-auto text-center py-6 space-y-4">
            <div class="w-16 h-16 mx-auto rounded-2xl gold-gradient-bg flex items-center justify-center text-3xl">👑</div>
            <div>
              <h1 class="text-2xl font-royal font-bold">KING AI PRO</h1>
              <p class="text-xs text-amber-300 font-semibold">Created & Owned by Abdullah Waheed</p>
            </div>
          </div>
        </div>

        <!-- Input Bar -->
        <div class="p-3 border-t border-king-border bg-king-slate">
          <form onsubmit="handleChatSubmit(event)" class="max-w-3xl mx-auto flex items-center gap-2">
            <input id="chatInput" type="text" placeholder="Ask King AI..." class="flex-1 bg-slate-900 text-xs rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:border-amber-500">
            <button type="submit" class="gold-gradient-bg text-slate-950 p-2.5 rounded-xl font-bold">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>
        </div>
      </section>

      <!-- TAB: SETTINGS -->
      <section id="tab-settings" class="hidden flex-1 p-6 space-y-4">
        <h2 class="text-xl font-bold">Settings & Custom API</h2>
        <div class="p-4 bg-king-card border border-king-border rounded-xl space-y-3 max-w-md">
          <label class="block text-xs font-bold text-slate-300">Gemini API Key</label>
          <input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="w-full bg-slate-900 p-2.5 text-xs rounded-lg border border-slate-700">
          <button onclick="saveApiKey()" class="px-4 py-2 bg-amber-400 text-slate-950 text-xs font-bold rounded-lg">Save Key</button>
        </div>
      </section>

    </main>
  </div>

  <script>
    let isVip = sessionStorage.getItem('king_ai_vip') === 'true';
    let sessions = JSON.parse(localStorage.getItem('king_ai_sessions') || '[]');
    let currentSessionId = localStorage.getItem('king_ai_active_session') || null;

    function init() {
      const savedKey = localStorage.getItem('king_ai_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

      if (!currentSessionId || !sessions.find(s => s.id === currentSessionId)) {
        createNewChat(false);
      } else {
        loadSession(currentSessionId);
      }
      renderSessionList();
    }

    function createNewChat(render = true) {
      currentSessionId = 'session_' + Date.now();
      sessions.unshift({ id: currentSessionId, title: 'New Conversation', messages: [] });
      saveSessions();
      if (render) {
        renderSessionList();
        loadSession(currentSessionId);
      }
    }

    function saveSessions() {
      localStorage.setItem('king_ai_sessions', JSON.stringify(sessions));
      localStorage.setItem('king_ai_active_session', currentSessionId);
    }

    function loadSession(id) {
      currentSessionId = id;
      localStorage.setItem('king_ai_active_session', id);
      const session = sessions.find(s => s.id === id);
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';

      if (!session || session.messages.length === 0) {
        container.innerHTML = `
          <div id="welcomeScreen" class="max-w-xl mx-auto text-center py-6 space-y-4">
            <div class="w-16 h-16 mx-auto rounded-2xl gold-gradient-bg flex items-center justify-center text-3xl">👑</div>
            <div>
              <h1 class="text-2xl font-royal font-bold">KING AI PRO</h1>
              <p class="text-xs text-amber-300 font-semibold">Created & Owned by Abdullah Waheed</p>
            </div>
          </div>`;
      } else {
        session.messages.forEach(msg => renderBubble(msg.role, msg.text));
      }
      renderSessionList();
    }

    function renderSessionList() {
      const list = document.getElementById('chatHistoryList');
      list.innerHTML = '';
      sessions.forEach(s => {
        const btn = document.createElement('button');
        const isActive = s.id === currentSessionId;
        btn.className = `w-full text-left p-2 rounded-xl text-xs truncate border ${isActive ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 font-bold' : 'text-slate-400 border-transparent hover:bg-slate-800'}`;
        btn.innerText = s.title || 'Conversation';
        btn.onclick = () => loadSession(s.id);
        list.appendChild(btn);
      });
    }

    function clearAllHistory() {
      sessions = [];
      localStorage.removeItem('king_ai_sessions');
      createNewChat();
    }

    async function handleChatSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const apiKey = localStorage.getItem('king_ai_api_key');
      if (!apiKey) {
        alert('Please save your API key in Settings (⚙️) first!');
        switchTab('settings');
        return;
      }

      const session = sessions.find(s => s.id === currentSessionId);
      if (session.messages.length === 0) {
        session.title = text.substring(0, 25) + '...';
        const welcome = document.getElementById('welcomeScreen');
        if (welcome) welcome.remove();
      }

      // Add user message
      session.messages.push({ role: 'user', text });
      renderBubble('user', text);
      input.value = '';
      saveSessions();
      renderSessionList();

      const aiId = 'ai-' + Date.now();
      renderBubble('ai', '⚡ Thinking...', aiId);

      // Build compact context payload (Text only to avoid slowdowns)
      const payload = session.messages.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: payload })
        });

        const data = await res.json();
        const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
        
        document.getElementById(aiId).innerHTML = marked.parse(replyText);
        session.messages.push({ role: 'model', text: replyText });
        saveSessions();
      } catch (err) {
        document.getElementById(aiId).innerHTML = '<span class="text-red-400 font-bold">⚠️ Connection Error.</span>';
      }
    }

    function renderBubble(role, text, id = null) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = role === 'user' ? 'chat-bubble-user p-3 rounded-xl text-xs max-w-lg ml-auto' : 'chat-bubble-ai p-3 rounded-xl text-xs max-w-lg mr-auto';
      if (id) div.id = id;
      div.innerHTML = role === 'user' ? text : marked.parse(text);
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function switchTab(tab) {
      document.getElementById('tab-chat').classList.toggle('hidden', tab !== 'chat');
      document.getElementById('tab-settings').classList.toggle('hidden', tab !== 'settings');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('king_ai_api_key', key);
      alert('API Key Saved!');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      init();
    });
  </script>
</body>
</html>
