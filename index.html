<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KING AI PRO — Owned by Abdullah Waheed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@700;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-royal { font-family: 'Cinzel', serif; }
    .gold-gradient-bg { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fffbeb 0%, #fbbf24 40%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .vip-badge {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Authentication Shield Screen -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full text-center space-y-6">
      <div class="w-16 h-16 mx-auto rounded-2xl gold-gradient-bg flex items-center justify-center text-3xl">👑</div>
      <div>
        <h1 class="text-2xl font-royal font-bold text-white">KING AI PRO</h1>
        <p class="text-xs text-amber-300 font-semibold mt-1">Created & Owned by Abdullah Waheed</p>
      </div>
      <p class="text-xs text-slate-400">Sign in to claim your Lifetime VIP Pass and access synchronized chat history across all devices.</p>
      <button onclick="loginWithGoogle()" class="w-full py-3 gold-gradient-bg text-slate-950 font-black rounded-xl text-xs flex items-center justify-center gap-2 hover:opacity-90 transition">
        <span>Sign In & Activate VIP</span>
      </button>
    </div>
  </div>

  <!-- Main App Header -->
  <header class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg gold-gradient-bg flex items-center justify-center text-slate-950 font-black">👑</div>
      <div>
        <span class="font-royal font-black text-base gold-gradient-text">KING AI PRO</span>
        <p class="text-[10px] text-amber-300">Owned by Abdullah Waheed</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <!-- Dynamic VIP Badge -->
      <div id="vipStatusBadge" class="px-3 py-1.5 rounded-xl vip-badge text-slate-950 font-black text-xs flex items-center gap-1">
        <span>🎟️ VIP ACCESS UNLOCKED</span>
      </div>
      <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 font-bold">Logout</button>
    </div>
  </header>

  <!-- Application Body -->
  <div id="appContainer" class="hidden flex-1 flex h-[calc(100vh-57px)]">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-3 space-y-4 flex flex-col">
      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center gap-3">
        <img id="userAvatar" class="w-8 h-8 rounded-full border border-amber-400" src="" alt="User">
        <div class="overflow-hidden">
          <h3 id="userName" class="font-bold text-xs text-white truncate">User</h3>
          <p id="userVipText" class="text-[10px] text-amber-400 font-bold">🌟 Lifetime VIP Member</p>
        </div>
      </div>

      <div class="flex-1 space-y-2 overflow-y-auto">
        <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
          <span>Cloud Saved Chats</span>
          <button onclick="createNewChat()" class="text-amber-400 hover:underline">+ New</button>
        </div>
        <div id="cloudChatList" class="space-y-1"></div>
      </div>
    </aside>

    <!-- Chat View -->
    <main class="flex-1 flex flex-col bg-slate-950">
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      
      <div class="p-3 border-t border-slate-800 bg-slate-900">
        <form onsubmit="handleChatSubmit(event)" class="max-w-3xl mx-auto flex gap-2">
          <input id="chatInput" type="text" placeholder="Ask King AI anything with unlimited VIP access..." class="flex-1 bg-slate-950 text-xs rounded-xl px-4 py-3 border border-slate-800 text-white focus:outline-none focus:border-amber-500">
          <button type="submit" class="gold-gradient-bg text-slate-950 px-5 py-3 rounded-xl font-bold text-xs hover:opacity-90">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_PUBLIC_CLIENT_KEY",
      authDomain: "your-app.firebaseapp.com",
      projectId: "your-app-id",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const functions = firebase.functions();

    let currentUser = null;
    let activeChatId = null;

    // Authentication State
    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        document.getElementById('userName').innerText = user.displayName;
        document.getElementById('userAvatar').src = user.photoURL;

        // Auto-assign VIP Status in Cloud Database
        await setupUserProfile(user);
        syncCloudData();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('appContainer').classList.add('hidden');
      }
    });

    // Save VIP Pass to User Document
    async function setupUserProfile(user) {
      const userRef = db.collection('users').doc(user.uid);
      await userRef.set({
        name: user.displayName,
        email: user.email,
        vipPass: true,
        vipTier: "Lifetime VIP",
        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    }

    function logout() {
      auth.signOut();
    }

    // Sync Chats Across Devices
    function syncCloudData() {
      db.collection('users').doc(currentUser.uid).collection('chats')
        .orderBy('updatedAt', 'desc')
        .onSnapshot(snapshot => {
          const chatList = document.getElementById('cloudChatList');
          chatList.innerHTML = '';
          snapshot.forEach(doc => {
            const chat = doc.data();
            const btn = document.createElement('button');
            btn.className = 'w-full text-left p-2 rounded-lg text-xs truncate bg-slate-800 hover:bg-slate-700 text-slate-200 mb-1 flex items-center justify-between';
            btn.innerHTML = `<span>${chat.title || 'Conversation'}</span> <span class="text-[9px] text-amber-400">VIP</span>`;
            btn.onclick = () => loadCloudChat(doc.id, chat.messages);
            chatList.appendChild(btn);
          });
        });
    }

    async function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      
      const callGemini = functions.httpsCallable('geminiProxy');
      
      try {
        const result = await callGemini({
          systemInstruction: { parts: [{ text: "You are KING AI PRO, created and owned by Abdullah Waheed. Provide VIP tier answers." }] },
          contents: [{ parts: [{ text: text }] }]
        });

        const reply = result.data.candidates[0].content.parts[0].text;
        saveMessageToCloud(text, reply);

      } catch (error) {
        console.error("Backend request failed:", error);
      }
    }

    function saveMessageToCloud(userMsg, aiMsg) {
      if (!activeChatId) {
        activeChatId = db.collection('users').doc(currentUser.uid).collection('chats').doc().id;
      }

      const chatRef = db.collection('users').doc(currentUser.uid).collection('chats').doc(activeChatId);
      
      chatRef.set({
        title: userMsg.substring(0, 20) + '...',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        messages: firebase.firestore.FieldValue.arrayUnion(
          { role: 'user', text: userMsg },
          { role: 'assistant', text: aiMsg }
        )
      }, { merge: true });
    }

    function createNewChat() {
      activeChatId = null;
      document.getElementById('chatMessages').innerHTML = '';
    }

    function loadCloudChat(id, messages) {
      activeChatId = id;
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = m.role === 'user' ? 'p-3 rounded-xl bg-slate-800 text-xs ml-auto max-w-md' : 'p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-amber-300 mr-auto max-w-md';
        div.innerText = m.text;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
